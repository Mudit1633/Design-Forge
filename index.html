<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DesignForge — 3D Product Design Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --bg:#0a0a0f;--surface:#12121a;--surface2:#1c1c28;--border:#2a2a3a;
  --accent:#ff3c00;--accent2:#00d4ff;--gold:#ffd200;--green:#50c878;
  --text:#f0f0f5;--muted:#6b6b80;
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.4}
#root{min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:60px;background:rgba(10,10,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{font-family:var(--font-display);font-size:1.8rem;letter-spacing:2px;color:var(--text);cursor:pointer}
.logo span{color:var(--accent)}
.nav-actions{display:flex;gap:1rem;align-items:center}
.btn{padding:.45rem 1.2rem;border-radius:4px;font-family:var(--font-body);font-size:.85rem;font-weight:500;cursor:pointer;border:none;transition:all .2s}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#ff5522;transform:translateY(-1px)}
.btn-lg{padding:.8rem 2.2rem;font-size:1rem}
.app{padding-top:60px}

/* HERO */
.hero{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 60px);text-align:center;padding:4rem 2rem;overflow:hidden}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,60,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,60,0,.06) 1px,transparent 1px);background-size:60px 60px;animation:gridMove 20s linear infinite}
@keyframes gridMove{from{background-position:0 0}to{background-position:60px 60px}}
.hero-glow{position:absolute;width:700px;height:700px;background:radial-gradient(circle,rgba(255,60,0,.1) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.hero-tag{font-family:var(--font-mono);font-size:.75rem;letter-spacing:4px;color:var(--accent);text-transform:uppercase;margin-bottom:1.5rem;animation:fadeUp .6s .2s both;position:relative}
.hero-title{font-family:var(--font-display);font-size:clamp(4rem,12vw,10rem);line-height:.9;letter-spacing:4px;margin-bottom:1.5rem;animation:fadeUp .6s .4s both;position:relative}
.hero-title .acc{color:var(--accent)}
.hero-sub{font-size:1.1rem;color:var(--muted);max-width:520px;line-height:1.7;margin-bottom:2.5rem;font-weight:300;animation:fadeUp .6s .6s both;position:relative}
.hero-ctas{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;animation:fadeUp .6s .8s both;position:relative}
.hero-stats{display:flex;gap:3rem;margin-top:4rem;animation:fadeUp .6s 1s both;position:relative}
.stat{text-align:center}
.stat-num{font-family:var(--font-display);font-size:2.5rem;color:var(--accent2)}
.stat-label{font-size:.75rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ───── DESIGN PICKER SCREEN ───── */
.picker-screen{
  position:fixed;inset:0;top:60px;background:var(--bg);z-index:50;
  display:flex;flex-direction:column;overflow:hidden;
  animation:slideIn .35s cubic-bezier(.16,1,.3,1);
}
@keyframes slideIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.picker-header{
  padding:2rem 2.5rem 1.2rem;
  border-bottom:1px solid var(--border);
  background:rgba(18,18,26,.95);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.picker-title-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:1rem}
.picker-heading{font-family:var(--font-display);font-size:2.8rem;letter-spacing:2px;line-height:1}
.picker-heading span{color:var(--accent2)}
.picker-back{display:flex;align-items:center;gap:.4rem;color:var(--muted);cursor:pointer;font-size:.85rem;transition:color .2s;border:none;background:none;font-family:var(--font-body)}
.picker-back:hover{color:var(--text)}

/* SEARCH BAR */
.search-wrap{position:relative;margin-bottom:1.2rem}
.search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1rem;pointer-events:none}
.search-input{
  width:100%;padding:.7rem 1rem .7rem 2.6rem;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);border-radius:8px;font-size:.95rem;font-family:var(--font-body);
  transition:border-color .2s;
}
.search-input:focus{outline:none;border-color:var(--accent2)}
.search-input::placeholder{color:var(--muted)}

/* FILTER TABS */
.filter-tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.ftab{
  padding:.35rem .9rem;border-radius:20px;font-size:.78rem;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--muted);
  font-family:var(--font-body);transition:all .15s;white-space:nowrap;
}
.ftab:hover{color:var(--text);border-color:var(--muted)}
.ftab.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* PICKER BODY */
.picker-body{flex:1;overflow-y:auto;padding:1.5rem 2.5rem 3rem}

/* SECTION GROUP */
.pg-section{margin-bottom:2.5rem}
.pg-section-title{
  font-family:var(--font-mono);font-size:.7rem;letter-spacing:4px;text-transform:uppercase;
  color:var(--muted);margin-bottom:1rem;display:flex;align-items:center;gap:.6rem;
}
.pg-section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* DESIGN ITEM GRID */
.design-items-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:.8rem;
}

/* DESIGN ITEM CARD */
.di-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:1.2rem 1rem;cursor:pointer;transition:all .22s;
  display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;
  position:relative;overflow:hidden;
}
.di-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--di-color,var(--accent))11,transparent 60%);
  opacity:0;transition:opacity .22s;
}
.di-card:hover{transform:translateY(-3px);border-color:var(--di-color,var(--accent));box-shadow:0 8px 24px rgba(0,0,0,.4)}
.di-card:hover::before{opacity:1}
.di-card.featured{border-color:var(--di-color,var(--accent));background:linear-gradient(135deg,var(--surface),rgba(255,60,0,.05))}
.di-emoji{font-size:1.8rem;line-height:1}
.di-name{font-weight:600;font-size:.88rem;line-height:1.3}
.di-desc{font-size:.72rem;color:var(--muted);line-height:1.4}
.di-badge{
  font-family:var(--font-mono);font-size:.6rem;padding:.15rem .45rem;border-radius:10px;
  background:rgba(255,255,255,.07);color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:.2rem;
}
.di-badge.hot{background:rgba(255,60,0,.15);color:var(--accent)}
.di-badge.new{background:rgba(0,212,255,.15);color:var(--accent2)}
.di-badge.pro{background:rgba(255,210,0,.12);color:var(--gold)}

/* POPULAR ROW — horizontal scroll */
.popular-row{display:flex;gap:.8rem;overflow-x:auto;padding-bottom:.5rem}
.popular-row::-webkit-scrollbar{height:4px}
.pop-chip{
  flex-shrink:0;display:flex;align-items:center;gap:.5rem;
  padding:.6rem 1rem;border-radius:8px;cursor:pointer;
  background:var(--surface);border:1px solid var(--border);
  font-size:.82rem;transition:all .2s;white-space:nowrap;
}
.pop-chip:hover{border-color:var(--accent);color:var(--accent)}
.pop-chip-icon{font-size:1.1rem}

/* NO RESULTS */
.no-results{text-align:center;padding:4rem 2rem;color:var(--muted)}
.no-results-emoji{font-size:3rem;margin-bottom:1rem}

/* EDITOR */
.editor-wrap{display:flex;flex-direction:column;height:calc(100vh - 60px)}
.toolbar{display:flex;align-items:center;gap:.5rem;padding:.6rem 1rem;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;overflow-x:auto}
.toolbar-sep{width:1px;height:24px;background:var(--border);margin:0 .2rem;flex-shrink:0}
.tool-btn{padding:.4rem .8rem;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:4px;cursor:pointer;font-size:.8rem;font-family:var(--font-body);transition:all .15s;display:flex;align-items:center;gap:.4rem;white-space:nowrap;flex-shrink:0}
.tool-btn:hover,.tool-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tool-btn.active-blue{background:var(--accent2);border-color:var(--accent2);color:#000}
.workspace{flex:1;display:flex;overflow:hidden}
.canvas-wrap{flex:1;position:relative;background:#080810}
.three-canvas{width:100%;height:100%;display:block}
.canvas-info{position:absolute;bottom:1rem;left:1rem;font-family:var(--font-mono);font-size:.7rem;color:var(--muted);pointer-events:none;line-height:1.8}
.canvas-info span{color:var(--accent2)}
.canvas-subject{position:absolute;top:1rem;left:50%;transform:translateX(-50%);font-family:var(--font-display);font-size:1rem;letter-spacing:3px;color:rgba(255,255,255,.15);pointer-events:none;text-transform:uppercase;white-space:nowrap}

/* PROPS */
.props{width:260px;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:1rem;flex-shrink:0}
.props-sec{margin-bottom:1.5rem}
.props-hd{font-family:var(--font-mono);font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:.8rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}
.prop-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;gap:.5rem}
.prop-label{font-size:.78rem;color:var(--muted);flex-shrink:0}
.prop-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.3rem .5rem;border-radius:3px;font-size:.78rem;font-family:var(--font-mono);width:100%;transition:border-color .2s}
.prop-input:focus{outline:none;border-color:var(--accent2)}
.color-pick{width:100%;height:32px;border-radius:3px;border:1px solid var(--border);cursor:pointer;background:none}
.obj-list{list-style:none}
.obj-item{display:flex;align-items:center;gap:.5rem;padding:.4rem .6rem;border-radius:4px;cursor:pointer;font-size:.82rem;transition:background .15s;border:1px solid transparent}
.obj-item:hover{background:var(--surface2)}
.obj-item.sel{background:rgba(255,60,0,.1);border-color:var(--accent)}
.obj-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.obj-name{flex:1}
.obj-del{color:var(--muted);cursor:pointer;font-size:.7rem}
.obj-del:hover{color:var(--accent)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;width:90%;max-width:460px;animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.modal-title{font-family:var(--font-display);font-size:2rem;margin-bottom:1.5rem;letter-spacing:2px}
.form-group{margin-bottom:1rem}
.form-label{font-size:.78rem;color:var(--muted);margin-bottom:.4rem;display:block;font-family:var(--font-mono);letter-spacing:1px;text-transform:uppercase}
.form-input,.form-select,.form-textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.6rem .8rem;border-radius:4px;font-family:var(--font-body);font-size:.9rem;transition:border-color .2s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--accent)}
.form-select option{background:var(--surface)}
.form-textarea{resize:vertical;min-height:80px}
.toggle-row{display:flex;align-items:center;justify-content:space-between}
.toggle{width:44px;height:24px;background:var(--surface2);border-radius:12px;cursor:pointer;position:relative;border:1px solid var(--border);transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}
.modal-actions{display:flex;gap:.8rem;margin-top:1.5rem;justify-content:flex-end}
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);padding:.8rem 1.2rem;border-radius:6px;font-size:.85rem;z-index:500;transform:translateY(100px);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-left-color:var(--accent2)}

/* SECTION */
.section{padding:2rem}
.section-tag{font-family:var(--font-mono);font-size:.7rem;color:var(--accent);letter-spacing:4px;text-transform:uppercase;margin-bottom:.5rem}
.section-title{font-family:var(--font-display);font-size:3rem;letter-spacing:2px;margin-bottom:2.5rem}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.2rem}
.design-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:all .3s;cursor:pointer}
.design-card:hover{transform:translateY(-4px);border-color:var(--accent2)}
.design-thumb{width:100%;aspect-ratio:16/9;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:3rem}
.design-thumb img{width:100%;height:100%;object-fit:cover}
.design-info{padding:1rem}
.design-name{font-weight:600;margin-bottom:.3rem}
.design-meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-family:var(--font-mono)}
.cat-badge{display:inline-block;font-size:.68rem;padding:.2rem .5rem;border-radius:20px;background:var(--surface2);border:1px solid var(--border);margin-top:.5rem;font-family:var(--font-mono);letter-spacing:1px}
.empty-state{color:var(--muted);font-size:.9rem;grid-column:1/-1;text-align:center;padding:3rem 0}

@media(max-width:768px){
  .props{display:none}
  .hero-stats{gap:1.5rem}
  .picker-body{padding:1rem 1rem 3rem}
  .picker-header{padding:1.2rem 1rem .8rem}
  .design-items-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .picker-heading{font-size:2rem}
}
</style>
</head>
