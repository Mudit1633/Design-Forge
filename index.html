<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DesignForge — 3D Design Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#08080f;--surface:#111119;--s2:#191926;--border:#252535;
  --accent:#ff3c00;--a2:#00d4ff;--gold:#ffd200;--green:#00e676;
  --text:#eeeef5;--muted:#5a5a70;
  --ff:'Bebas Neue',sans-serif;
  --fb:'DM Sans',sans-serif;
  --fm:'JetBrains Mono',monospace;
  --nav:62px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--fb)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── TOPBAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:900;
  height:var(--nav);display:flex;align-items:center;
  justify-content:space-between;padding:0 1.8rem;
  background:rgba(8,8,15,.96);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
}
.logo{font-family:var(--ff);font-size:1.85rem;letter-spacing:3px;cursor:pointer;color:var(--text)}
.logo b{color:var(--accent)}
.topbar-r{display:flex;gap:.6rem;align-items:center}

/* ── BUTTONS ── */
.btn{padding:.4rem 1rem;border-radius:6px;font-family:var(--fb);font-size:.82rem;font-weight:500;cursor:pointer;border:none;transition:all .18s;white-space:nowrap}
.btn-o{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-o:hover{color:var(--text);border-color:var(--a2)}
.btn-r{background:var(--accent);color:#fff}
.btn-r:hover{background:#ff5020;transform:translateY(-1px)}
.btn-c{background:var(--a2);color:#000;font-weight:700}
.btn-c:hover{opacity:.88}
.btn-g{background:var(--green);color:#000;font-weight:700}
.btn-g:hover{opacity:.88;transform:translateY(-1px)}
.btn-lg{padding:.72rem 1.9rem;font-size:.96rem}

/* ── SCREENS ── */
.screen{position:fixed;inset:0;top:var(--nav);display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}

/* ════════════════════════════════
   HERO
════════════════════════════════ */
#s-hero{align-items:center;justify-content:center;text-align:center;padding:3rem 2rem;overflow:auto}
.hgrid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,60,0,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,60,0,.05) 1px,transparent 1px);background-size:56px 56px;animation:gm 24s linear infinite}
@keyframes gm{to{background-position:56px 56px}}
.hglow{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(255,60,0,.09) 0%,transparent 68%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.hero-inner{position:relative;z-index:1}
