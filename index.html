<style>
/* ── RESET & VARS ── */
:root{
  --bg:#08080f;--sur:#111119;--s2:#181825;--brd:#242434;
  --acc:#ff3c00;--a2:#00d4ff;--gold:#ffd200;--grn:#00e676;
  --txt:#eeeef5;--mut:#55556a;
  --fh:'Bebas Neue',sans-serif;
  --fb:'DM Sans',sans-serif;
  --fm:'JetBrains Mono',monospace;
  --nh:62px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px}
input,select,textarea,button{font-family:var(--fb)}
input:focus,select:focus,textarea:focus{outline:none}

/* ════════════════════════════════════
   AUTH SCREEN
════════════════════════════════════ */
#auth{
  position:fixed;inset:0;z-index:9000;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:1rem;overflow-y:auto;
}
#auth.gone{display:none}
.auth-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,60,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,60,0,.04) 1px,transparent 1px);background-size:52px 52px;animation:gm 20s linear infinite}
@keyframes gm{to{background-position:52px 52px}}
.auth-card{
  position:relative;z-index:1;
  width:100%;max-width:430px;
  background:var(--sur);border:1px solid var(--brd);border-radius:18px;
  padding:2.2rem 2rem;
  animation:cardIn .38s cubic-bezier(.16,1,.3,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
.auth-logo{font-family:var(--fh);font-size:2.1rem;letter-spacing:3px;text-align:center;margin-bottom:.2rem}
.auth-logo b{color:var(--acc)}
.auth-tag{font-family:var(--fm);font-size:.6rem;letter-spacing:4px;color:var(--mut);text-transform:uppercase;text-align:center;margin-bottom:1.8rem}
/* tabs */
.atabs{display:flex;background:var(--s2);border-radius:8px;padding:3px;gap:3px;margin-bottom:1.6rem}
.atab{flex:1;padding:.48rem;text-align:center;cursor:pointer;font-weight:600;font-size:.84rem;color:var(--mut);transition:all .18s;background:transparent;border:none;border-radius:6px}
.atab.on{background:var(--acc);color:#fff}
.apanel{display:none}.apanel.on{display:block}
/* avatar */
.av-row{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.4rem}
.av{width:42px;height:42px;border-radius:50%;border:2px solid var(--brd);cursor:pointer;font-size:1.3rem;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--s2)}
.av:hover{border-color:var(--a2);transform:scale(1.08)}
.av.on{border-color:var(--acc);background:rgba(255,60,0,.12);transform:scale(1.1)}
/* form fields */
.fg{margin-bottom:.85rem}
.fl{font-size:.68rem;color:var(--mut);margin-bottom:.3rem;display:block;font-family:var(--fm);letter-spacing:1px;text-transform:uppercase}
.fi{width:100%;background:var(--s2);border:1px solid var(--brd);color:var(--txt);padding:.56rem .78rem;border-radius:7px;font-size:.88rem;transition:border-color .2s}
.fi:focus{border-color:var(--a2)}
.fi::placeholder{color:var(--mut)}
.fi.er{border-color:var(--acc)}
/* password strength */
.pw-bar-wrap{height:3px;background:var(--brd);border-radius:2px;margin-top:.3rem;overflow:hidden}
.pw-bar{height:100%;width:0;border-radius:2px;transition:width .3s,background .3s}
.pw-hint{font-size:.6rem;color:var(--mut);font-family:var(--fm);margin-top:.2rem}
/* error */
.aerr{font-size:.75rem;color:var(--acc);min-height:1rem;margin-bottom:.6rem;font-family:var(--fm)}
/* submit */
.asub{
  width:100%;padding:.72rem;background:var(--acc);color:#fff;border:none;
  border-radius:8px;font-family:var(--fh);font-size:1.2rem;letter-spacing:2px;
  cursor:pointer;transition:all .2s;margin-top:.2rem;
}
.asub:hover{background:#ff5020;transform:translateY(-1px)}
.asub.demo{background:var(--s2);color:var(--txt);border:1px solid var(--brd);font-family:var(--fb);font-size:.9rem;letter-spacing:0;margin-top:.6rem}
.asub.demo:hover{border-color:var(--a2);background:var(--s2)}
.adiv{display:flex;align-items:center;gap:.7rem;margin:1rem 0;color:var(--mut);font-size:.72rem}
.adiv::before,.adiv::after{content:'';flex:1;height:1px;background:var(--brd)}
.ahint{text-align:center;font-size:.76rem;color:var(--mut);margin-top:.9rem}
.ahint b{color:var(--a2);cursor:pointer}
.ahint b:hover{text-decoration:underline}

/* ════════════════════════════════════
   TOPBAR
════════════════════════════════════ */
#bar{
  position:fixed;top:0;left:0;right:0;z-index:800;
  height:var(--nh);display:flex;align-items:center;justify-content:space-between;
  padding:0 1.8rem;
  background:rgba(8,8,15,.97);backdrop-filter:blur(24px);

}
.logo{font-family:var(--fh);font-size:1.9rem;letter-spacing:3px;cursor:pointer;color:var(--txt)}
.logo b{color:var(--acc)}
.bar-r{display:flex;gap:.55rem;align-items:center}
.ubadge{

  padding:.28rem .7rem;background:var(--s2);border:1px solid var(--brd);
  border-radius:20px;font-size:.76rem;cursor:pointer;transition:all .18s;
}
.ubadge:hover{border-color:var(--a2)}
.uav{font-size:1rem}

/* ════════════════════════════════════
   BUTTONS
════════════════════════════════════ */
.btn{padding:.4rem 1rem;border-radius:6px;font-size:.82rem;font-weight:500;cursor:pointer;border:none;transition:all .18s;white-space:nowrap}
.btn-o{background:transparent;color:var(--mut);border:1px solid var(--brd)}

.btn-r{background:var(--acc);color:#fff}

.btn-c{background:var(--a2);color:#000;font-weight:700}

.btn-g{background:var(--grn);color:#000;font-weight:700}
.btn-g:hover{opacity:.88;transform:translateY(-1px)}
.btn-lg{padding:.7rem 1.9rem;font-size:.95rem}

/* ════════════════════════════════════
   SCREENS
════════════════════════════════════ */
.scr{position:fixed;inset:0;top:var(--nh);display:none;flex-direction:column;overflow:hidden}
.scr.on{display:flex}

/* ════════════════════════════════════
   HERO
════════════════════════════════════ */
#s-hero{align-items:center;justify-content:center;text-align:center;padding:3rem 2rem;overflow:auto}
.hgrid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,60,0,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,60,0,.05) 1px,transparent 1px);background-size:54px 54px;animation:gm 24s linear infinite}
.hglow{position:absolute;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(255,60,0,.09),transparent 68%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.hi{position:relative;z-index:1}
.htag{font-family:var(--fm);font-size:.7rem;letter-spacing:5px;color:var(--acc);text-transform:uppercase;margin-bottom:1.2rem}
.htitle{font-family:var(--fh);font-size:clamp(3.5rem,10vw,8rem);line-height:.88;letter-spacing:4px;margin-bottom:1.2rem}
.htitle em{color:var(--acc);font-style:normal}
.hsub{font-size:1rem;color:var(--mut);max-width:460px;line-height:1.7;margin:0 auto 2.4rem;font-weight:300}

.hstats{display:flex;gap:2.8rem;margin-top:3.5rem;justify-content:center}
.stn{font-family:var(--fh);font-size:2.3rem;color:var(--a2)}
.stl{font-size:.66rem;color:var(--mut);letter-spacing:2px;text-transform:uppercase}

/* ════════════════════════════════════
   PICKER
════════════════════════════════════ */
#s-pick{overflow:hidden}
.pkh{padding:1.3rem 2rem .9rem;background:var(--sur);border-bottom:1px solid var(--brd);flex-shrink:0}
.pkr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:.9rem;gap:.8rem;flex-wrap:wrap}
.pktag{font-family:var(--fm);font-size:.6rem;color:var(--acc);letter-spacing:4px;text-transform:uppercase;margin-bottom:.25rem}
.pktitle{font-family:var(--fh);font-size:clamp(1.5rem,4vw,2.3rem);letter-spacing:2px}

.pkback{background:none;border:1px solid var(--brd);color:var(--mut);padding:.34rem .8rem;border-radius:5px;cursor:pointer;font-size:.78rem;transition:all .17s}
.pkback:hover{color:var(--txt);border-color:var(--acc)}

#srch{width:100%;padding:.58rem .9rem .58rem 2.25rem;background:var(--s2);border:1px solid var(--brd);color:var(--txt);border-radius:7px;font-size:.87rem;transition:border-color .2s}

.ftabs{display:flex;gap:.32rem;flex-wrap:wrap}

.ftab:hover{color:var(--txt)}
.ftab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pkbody{flex:1;overflow-y:auto;padding:1.3rem 2rem 3rem}
.poprow{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:1.6rem}
.poprow::-webkit-scrollbar{height:3px}
.pchip{flex-shrink:0;display:flex;align-items:center;gap:.38rem;padding:.45rem .85rem;border-radius:7px;cursor:pointer;background:var(--sur);border:1px solid var(--brd);font-size:.77rem;transition:all .17s;white-space:nowrap}
.pchip:hover{border-color:var(--acc);color:var(--acc)}
.shd{font-family:var(--fm);font-size:.6rem;letter-spacing:4px;text-transform:uppercase;margin-bottom:.78rem;display:flex;align-items:center;gap:.52rem}
