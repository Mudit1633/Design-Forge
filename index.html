<!DOCTYPE html>
<html lang="en">
<head>

<style>
/* ═══════ RESET & VARS ═══════ */
:root{
  --bg:#0a0a0f; --surface:#12121a; --surface2:#1c1c28; --border:#2a2a3a;
  --accent:#ff3c00; --accent2:#00d4ff; --gold:#ffd200; --green:#39d353;

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--fb);overflow-x:hidden}
::-webkit-scrollbar{width:5px}

/* ═══════ NAV ═══════ */
nav{

  display:flex;align-items:center;justify-content:space-between;

}
.logo{font-family:var(--ff);font-size:1.9rem;letter-spacing:2px;cursor:pointer;color:var(--text);user-select:none}

/* ═══════ BUTTONS ═══════ */

}
.btn-g{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-g:hover{color:var(--text);border-color:var(--accent)}

.btn-p:hover{background:#ff5520;transform:translateY(-1px)}
.btn-b{background:var(--accent2);color:#000;font-weight:600}

.btn-lg{padding:.75rem 2rem;font-size:.98rem}

/* ═══════ VIEWS ═══════ */
#app{padding-top:var(--nav)}
.view{display:none;min-height:calc(100vh - var(--nav))}
.view.active{display:block}
#v-editor.active{display:flex;flex-direction:column;height:calc(100vh - var(--nav))}
#v-picker.active{display:flex;flex-direction:column;height:calc(100vh - var(--nav))}

/* ═══════ HERO ═══════ */
#v-hero{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;
  padding:4rem 2rem;overflow:hidden;position:relative;
}
.hgrid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,60,0,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,60,0,.055) 1px,transparent 1px);
  background-size:58px 58px;animation:gm 22s linear infinite;
}
@keyframes gm{to{background-position:58px 58px}}
.hglow{
  position:absolute;width:700px;height:700px;border-radius:50%;

}
.htag{position:relative;font-family:var(--fm);font-size:.72rem;letter-spacing:4px;color:var(--accent);text-transform:uppercase;margin-bottom:1.3rem}

/* ═══════ PICKER ═══════ */
#v-picker{overflow:hidden}

.pk-back{background:none;border:1px solid var(--border);color:var(--muted);padding:.38rem .85rem;border-radius:5px;cursor:pointer;font-family:var(--fb);font-size:.8rem;transition:all .18s}
.pk-back:hover{color:var(--text);border-color:var(--accent)}
.srch-wrap{position:relative;margin-bottom:.9rem}
.srch-icon{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
#srch{
  width:100%;padding:.62rem .9rem .62rem 2.3rem;
  background:var(--surface2);border:1px solid var(--border);

}
#srch:focus{outline:none;border-color:var(--accent2)}
#srch::placeholder{color:var(--muted)}
.ftabs{display:flex;gap:.38rem;flex-wrap:wrap}
.ftab{padding:.28rem .75rem;border-radius:20px;font-size:.73rem;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--fb);transition:all .15s}
.ftab:hover{color:var(--text)}
.ftab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pk-body{flex:1;overflow-y:auto;padding:1.4rem 2rem 3rem}
.pop-row{display:flex;gap:.65rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:1.8rem}
.pop-row::-webkit-scrollbar{height:3px}

.di{background:var(--surface);border:2px solid transparent;border-radius:10px;padding:1rem .9rem;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.di:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.45)}
.di-glow{position:absolute;inset:0;opacity:0;transition:opacity .2s}
.di:hover .di-glow{opacity:1}
.di-em{font-size:1.75rem;margin-bottom:.42rem;line-height:1;position:relative}
.di-name{font-weight:600;font-size:.84rem;margin-bottom:.27rem;line-height:1.25;position:relative}
.di-desc{font-size:.68rem;color:var(--muted);line-height:1.4;margin-bottom:.38rem;position:relative}
.badge{display:inline-block;font-size:.56rem;padding:.13rem .38rem;border-radius:10px;font-family:var(--fm);letter-spacing:1px;text-transform:uppercase;position:relative}
.b-hot{background:rgba(255,60,0,.15);color:var(--accent)}
.b-new{background:rgba(0,212,255,.15);color:var(--accent2)}
.b-pro{background:rgba(255,210,0,.12);color:var(--gold)}
.no-res{text-align:center;padding:4rem 2rem;color:var(--muted)}
.no-em{font-size:2.5rem;margin-bottom:.8rem}
.no-t{font-family:var(--ff);font-size:1.4rem;margin-bottom:.4rem;color:var(--text)}

/* ═══════════════════════════════════════════════
   DESIGN SHEET — slides up after picking item
═══════════════════════════════════════════════ */
#design-sheet{
  position:fixed;inset:0;top:var(--nav);z-index:250;
  background:var(--bg);
  display:none;flex-direction:column;
  animation:sheetUp .38s cubic-bezier(.16,1,.3,1);
}
#design-sheet.open{display:flex}
@keyframes sheetUp{
  from{opacity:0;transform:translateY(40px) scale(.98)}
  to  {opacity:1;transform:translateY(0)   scale(1)}
}

/* ── Sheet Header ── */
.sh-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 1.5rem;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  flex-shrink:0;gap:1rem;flex-wrap:wrap;
}

.sh-back{
  background:none;border:1px solid var(--border);color:var(--muted);

  font-family:var(--fb);font-size:.8rem;transition:all .18s;flex-shrink:0;
}
.sh-back:hover{color:var(--text);border-color:var(--accent)}

.sh-info{}

  padding:.22rem .6rem;border-radius:20px;
}
.sh-right{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}

/* ── Shape Toolbar ── */
.sh-toolbar{
  display:flex;align-items:center;gap:.4rem;
  padding:.52rem 1.2rem;
  background:rgba(18,18,26,.95);
  border-bottom:1px solid var(--border);
  overflow-x:auto;flex-shrink:0;
}
.sh-toolbar::-webkit-scrollbar{height:3px}
.tsep{width:1px;height:22px;background:var(--border);margin:0 .1rem;flex-shrink:0}
.tb{
  padding:.33rem .68rem;background:var(--surface2);
  border:1px solid var(--border);color:var(--text);
  border-radius:4px;cursor:pointer;font-size:.77rem;
  font-family:var(--fb);transition:all .15s;white-space:nowrap;flex-shrink:0;
}
.tb:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.tb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tb-grp{display:flex;align-items:center;gap:.35rem;flex-shrink:0}
.tb-grp-label{font-family:var(--fm);font-size:.6rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;flex-shrink:0}

/* ── Sheet Body: Canvas + Props ── */
.sh-body{flex:1;display:flex;overflow:hidden;position:relative}

/* ── Canvas Area ── */
.canvas-area{
  flex:1;position:relative;
  background:radial-gradient(ellipse at 50% 40%, #0d0d1a 0%, #07070e 100%);
  cursor:crosshair;
}
#cv{width:100%;height:100%;display:block}

/* Canvas overlays */
.cv-watermark{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-family:var(--ff);font-size:clamp(2rem,6vw,5rem);

}

.props-panel{

}
.props-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.ptab{

  color:var(--muted);border:none;background:none;
  border-bottom:2px solid transparent;transition:all .15s;
}
.ptab:hover{color:var(--text)}
.ptab.on{color:var(--accent2);border-bottom-color:var(--accent2)}
.props-body{flex:1;overflow-y:auto;padding:.85rem}
.ph{
  font-family:var(--fm);font-size:.62rem;letter-spacing:3px;
  text-transform:uppercase;color:var(--muted);

.ph:first-child{margin-top:0}

.pi{

/* ── Scene Settings Panel ── */
.scene-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem}
.scene-label{font-size:.76rem;color:var(--muted)}
.stgl{

.stgl.on{background:var(--accent);border-color:var(--accent)}
.stgl::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:transform .18s}
.stgl.on::after{transform:translateX(18px)}

/* ═══════ SAVE MODAL ═══════ */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.78);
  backdrop-filter:blur(10px);z-index:400;
  display:none;align-items:center;justify-content:center;
}
.overlay.open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:2rem;width:92%;max-width:460px;
  animation:mIn .28s ease;
}
@keyframes mIn{from{opacity:0;transform:scale(.92) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-icon{font-size:2.5rem;text-align:center;margin-bottom:.6rem}
.modal-t{font-family:var(--ff);font-size:2rem;margin-bottom:.3rem;letter-spacing:2px;text-align:center}
.modal-sub{font-size:.82rem;color:var(--muted);text-align:center;margin-bottom:1.5rem}
.fg{margin-bottom:.85rem}
.fl{font-size:.72rem;color:var(--muted);margin-bottom:.32rem;display:block;font-family:var(--fm);letter-spacing:1px;text-transform:uppercase}
.fi,.fs,.ft{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:.55rem .75rem;border-radius:5px;
  font-family:var(--fb);font-size:.88rem;transition:border-color .2s;
}
.fi:focus,.fs:focus,.ft:focus{outline:none;border-color:var(--accent)}
.fs option{background:var(--surface)}
.ft{resize:vertical;min-height:70px}
.trow{display:flex;align-items:center;justify-content:space-between}
.tgl{
  width:44px;height:24px;background:var(--surface2);border-radius:12px;

}

.tgl.on::after{transform:translateX(20px)}

.success-box{
  background:var(--surface);border:1px solid var(--green);

}
.success-em{font-size:3.5rem;margin-bottom:.8rem}
.success-t{font-family:var(--ff);font-size:2.2rem;letter-spacing:2px;color:var(--green);margin-bottom:.5rem}
.success-sub{color:var(--muted);font-size:.88rem;margin-bottom:1.5rem;line-height:1.6}
.success-preview{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:.8rem 1rem;margin-bottom:1.5rem;
  text-align:left;
}
.sp-row{display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:.3rem}
.sp-label{color:var(--muted)}
.sp-val{color:var(--text);font-weight:500}
.success-actions{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}

/* ═══════ TOAST ═══════ */
.toast{
  position:fixed;bottom:1.5rem;right:1.5rem;z-index:600;
  background:var(--surface);border:1px solid var(--border);
  border-left:3px solid var(--accent);

/* ═══════ GALLERY ═══════ */
#v-gallery{padding:2rem}
.s-tag{font-family:var(--fm);font-size:.65rem;color:var(--accent);letter-spacing:4px;text-transform:uppercase;margin-bottom:.4rem}

.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.1rem}
.g-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:all .22s;cursor:pointer}

.g-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.g-info{padding:.9rem}
